name: fallback security

# The unit workflow runs only on pull requests into main and litellm_** branches, so a pull request into a fork
# release branch would merge without these proofs. This job runs them on every pull request.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fallback-security:
    name: fallback-security
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      UV_PYTHON: "3.12"
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        timeout-minutes: 3
        with:
          persist-credentials: false

      - name: Set up Python
        timeout-minutes: 3
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.UV_PYTHON }}

      - name: Set up uv
        timeout-minutes: 3
        uses: ./.github/actions/setup-uv-with-retries
        with:
          version: "0.10.9"

      - name: Cache uv dependencies
        timeout-minutes: 5
        uses: ./.github/actions/cache-uv-downloads

      - name: Cache the Rust build
        timeout-minutes: 5
        uses: ./.github/actions/cache-cargo-build

      - name: Install dependencies
        timeout-minutes: 25
        run: |
          .github/scripts/uv_sync_with_retries.sh --frozen --group ci --group proxy-dev --extra proxy --extra proxy-runtime --extra utils

      - name: Cache Prisma binaries
        timeout-minutes: 3
        uses: ./.github/actions/cache-prisma-binaries

      - name: Generate Prisma client
        timeout-minutes: 3
        run: |
          uv run --no-sync prisma generate --schema litellm/proxy/schema.prisma

      - name: Run the fallback security tests
        timeout-minutes: 15
        run: |
          uv run --no-sync pytest -q -n 4 -rA \
            tests/unit/proxy/auth/test_router_override_fallback_auth.py \
            tests/unit/llms/anthropic/pass_through/messages/test_anthropic_messages_router.py \
            tests/unit/router_utils/test_fallback_event_handlers.py
